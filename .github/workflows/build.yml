name: Build DevBuild
on:
    push:
        branches: [main]
        paths:
            - .github/workflows/build.yml
            - src/**
            - scripts/**
            - package.json
            - package-lock.json
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: devbuild
    cancel-in-progress: true

jobs:
    Build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: windows-latest, name: LeanCordInstaller-win.exe, bin: leancord-installer.exe }
                    - { os: ubuntu-latest, name: LeanCordInstaller-linux, bin: leancord-installer }
                    - { os: macos-latest, name: LeanCordInstaller-macos, bin: leancord-installer }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run typecheck
            - run: npm run build -- --minify
            - name: Build installer
              run: npm run installer:build

            - name: Rename
              run: mv dist-installer/${{ matrix.bin }} dist-installer/${{ matrix.name }}

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: dist-installer/${{ matrix.name }}

            - name: Publish to DevBuild release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ github.sha }}
              run: |
                  SHORT=${SHA::7}
                  gh release view devbuild >/dev/null 2>&1 || gh release create devbuild --prerelease --title "DevBuild $SHORT" --notes "Auto-build dari main" --target "$SHA"
                  gh release upload devbuild --clobber dist-installer/${{ matrix.name }}
                  gh release edit devbuild --title "DevBuild $SHORT" --target "$SHA"
