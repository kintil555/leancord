name: Build DevBuild
on:
    push:
        branches: [main]
        paths:
            - .github/workflows/build.yml
            - src/**
            - scripts/**
            - package.json
            - package-lock.json
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: devbuild
    cancel-in-progress: true

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build -- --minify

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: leancord-dist
                  path: dist/

            - name: Publish DevBuild release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ github.sha }}
              run: |
                  SHORT=${SHA::7}
                  gh release view devbuild >/dev/null 2>&1 || gh release create devbuild --prerelease --title "DevBuild $SHORT" --notes "Auto-build dari main" --target "$SHA"
                  gh release upload devbuild --clobber dist/main.js dist/preload.js dist/renderer.js
                  gh release edit devbuild --title "DevBuild $SHORT" --target "$SHA"
